






<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter + Gravação</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; }

        /* Câmera de fundo */
        #camera {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1); /* espelha a imagem como selfie */
        }

        /* Texto do teleprompter por cima */
        .area-texto {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 100%;
            z-index: 10;
            overflow: hidden;
            pointer-events: none;
        }
        #texto {
            font-size: 32px;
            line-height: 1.5;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9), -1px -1px 4px rgba(0,0,0,0.8);
            padding: 0 80px;
            text-align: center;
            white-space: pre-wrap;
        }
        .linha-guia {
            position: fixed;
            top: 42%; left: 0; right: 0;
            height: 2px;
            background: red;
            z-index: 15;
            box-shadow: 0 0 10px red;
        }

        /* Painel de controles */
        .controles {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85);
            padding: 12px;
            z-index: 20;
            transition: opacity 0.3s, transform 0.3s;
        }
        .controles.oculto {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }
        .botao-mostrar-controles {
            display: none;
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 40;
            background: #43a047;
            color: white;
        }
        .controles.oculto + .botao-mostrar-controles { display: block; }
        button {
            padding: 10px 14px;
            margin: 3px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-vermelho { background: #e53935; color: white; }
        .btn-vermelho:hover { background: #c62828; }
        .btn-azul { background: #1e88e5; color: white; }
        .btn-azul:hover { background: #1565c0; }
        .btn-verde { background: #43a047; color: white; }
        .btn-verde:hover { background: #2e7d32; }
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 8px;
            padding: 10px;
            border-radius: 6px;
            background: #222;
            color: white;
            border: 1px solid #444;
            font-size: 15px;
        }
        .controle-tamanho { color: #fff; font-weight: bold; margin: 3px 8px; }
        input[type="range"] { width: 130px; vertical-align: middle; accent-color: #43a047; }
        input[type="text"], select { padding: 9px; margin: 3px; background: #222; color: #fff; border: 1px solid #555; border-radius: 6px; }
        .status {
            display: inline-block;
            margin-left: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            background: #333;
        }
        .gravando { background: #e53935; animation: piscar 1s infinite; }
        .modo-cheio { background: #000; }
        .velocidade-flutuante { position: fixed; top: 18px; left: 18px; z-index: 30; display: none; padding: 8px 14px; border: 2px solid #22c55e; border-radius: 6px; background: rgba(0,0,0,.8); color: #22c55e; font-size: 18px; font-weight: bold; }
        .velocidade-flutuante.visivel { display: block; }
        .velocidade-box { display: inline-block; margin: 3px 8px; padding: 8px 12px; border: 2px solid #22c55e; border-radius: 6px; color: #22c55e; font-weight: bold; }
        @keyframes piscar { 50% { opacity: 0.4; } }
        @media (max-width: 600px) {
            .controles { max-height: 55vh; overflow-y: auto; padding: 8px; }
            .controles button, .controles input[type="text"], .controles select { max-width: 100%; }
            .controles button { padding: 10px 9px; font-size: 13px; }
            .controle-tamanho { display: flex; align-items: center; gap: 6px; }
            input[type="range"] { width: min(130px, 38vw); }
            #texto { padding: 0 16px; }
            .velocidade-box { margin: 3px; padding: 7px 9px; }
            .status { margin-left: 3px; }
        }
    
    .conta-topo{position:fixed;top:10px;right:10px;z-index:60;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 20px)}
    .conta-topo button{font-size:12px;padding:8px 10px;margin:0}
    .conta-painel{position:fixed;top:54px;right:10px;z-index:61;background:rgba(15,18,25,.97);border:1px solid #444;border-radius:12px;padding:14px;width:min(340px,calc(100vw - 20px));box-shadow:0 10px 35px #0009;display:none}
    .conta-painel.aberto{display:block}.conta-painel input,.conta-painel select{width:100%;margin:5px 0;padding:11px}
    .conta-painel button{margin:4px 2px}.conta-painel .linha{display:flex;gap:6px}.conta-painel .linha button{flex:1}
    .conta-painel small{color:#bbb;display:block;margin:7px 0}.saldo-chip{background:#173c2a;color:#8df0ae;border:1px solid #287a4b;border-radius:20px;padding:7px 10px;font-size:12px;font-weight:bold}
    @media(max-width:600px){.conta-topo{top:6px;right:6px}.conta-topo button{font-size:11px;padding:7px}.conta-painel{top:48px;right:6px}}

    </style>
</head>
<body>

<div class="conta-topo">
  <span id="saldoCreditos" class="saldo-chip">0 créditos</span>
  <button class="btn-azul" onclick="alternarPainelConta()">👤 Conta / Créditos</button>
</div>
<section id="painelConta" class="conta-painel">
  <div id="areaLogin">
    <strong>Conta Telepronto</strong>
    <small>Crie sua conta para guardar seus créditos e usar em outros dispositivos.</small>
    <input id="contaEmail" type="email" autocomplete="email" placeholder="Seu e-mail">
    <input id="contaSenha" type="password" autocomplete="current-password" placeholder="Senha (mínimo 8 caracteres)">
    <div class="linha"><button class="btn-verde" onclick="autenticarConta('register')">Criar conta</button><button class="btn-azul" onclick="autenticarConta('login')">Entrar</button></div>
    <small id="mensagemConta"></small>
  </div>
  <div id="areaCarteira" hidden>
    <strong id="emailContaAtiva"></strong>
    <p style="margin:8px 0">Saldo: <strong id="saldoDetalhe">0</strong> créditos</p>
    <label>Comprar créditos</label>
    <select id="pacoteCreditos">
      <option value="br-10">10 vídeos — R$ 1,00</option>
      <option value="br-20">20 vídeos — R$ 2,00</option>
      <option value="br-100">100 vídeos — R$ 10,00</option>
      <option value="br-500">500 vídeos — R$ 50,00</option>
    </select>
    <select id="moedaCreditos" onchange="atualizarPacotesTela()"><option value="BRL">Brasil — Real (BRL)</option><option value="USD">Exterior — Dólar (USD)</option></select>
    <button class="btn-verde" style="width:100%" onclick="comprarCreditos()">💳 Comprar pacote pela SumUp</button>
    <button class="btn-azul" onclick="atualizarSaldo()">↻ Atualizar saldo</button>
    <button class="btn-vermelho" onclick="sairConta()">Sair da conta</button>
    <small>Os créditos não expiram. Uma gravação concluída consome 1 crédito.</small>
  </div>
</section>


<!-- Câmera fica aqui atrás -->
<video id="camera" autoplay muted playsinline></video>
<div class="velocidade-flutuante" id="velocidadeFlutuante">Velocidade: <span id="velocidadeTela">0.80</span></div>

<!-- Linha guia vermelha -->
<div class="linha-guia"></div>

<!-- Texto rolando por cima -->
<div class="area-texto">
    <div id="texto"></div>
</div>

<!-- Botões e controles embaixo -->
<div class="controles">
    <button class="btn-verde" onclick="iniciarCamera()">📷 Ligar Câmera</button>
    <button class="btn-vermelho" onclick="iniciarGravacao(event)">● GRAVAR</button>
    <button class="btn-vermelho" onclick="pararGravacao()">⏹ Parar</button>
    <button class="btn-azul" onclick="iniciarTexto()">▶ Texto</button>
    <button class="btn-azul" onclick="pararTexto()">⏹ Texto</button>
    <button class="btn-azul" onclick="maisRapido()">⬆+</button>
    <button class="btn-azul" onclick="maisLento()">⬇-</button>
    <span class="velocidade-box">Velocidade: <span id="mostrarVelocidade">0.80</span></span>
    <button id="botaoTelaCheia" class="btn-azul" onclick="alternarTelaCheia()">⛶ Tela Cheia</button>
    <button id="btnGravarTelaCompleta" class="btn-vermelho" type="button" onclick="alternarGravacaoTelaCompleta()">🔴 Gravar a tela inteira</button>
    <button class="btn-azul" type="button" onclick="abrirGravadorTela()">📹 Gravador de tela HTML</button>
    <label class="controle-tamanho">Tamanho <input id="tamanhoTexto" type="range" min="20" max="100" value="32" oninput="alterarTamanho(this.value)"> <span id="mostrarTamanho">32px</span></label>
    <span id="status" class="status">pronto</span>
    <textarea id="entradaTexto" placeholder="Cole seu texto aqui... Depois clique em ▶ Texto para começar a rolar!"></textarea>
    <button class="btn-azul" onclick="carregarTexto()">✓ Colocar Texto</button>
    <input id="nomeTexto" type="text" placeholder="Nome do texto">
    <button class="btn-azul" onclick="salvarTextoNoProjeto()">💾 Salvar no projeto</button>
    <select id="textosSalvos" onchange="abrirTextoDoProjeto(this.value)"><option value="">Textos salvos no projeto</option></select>
    <button class="btn-azul" onclick="baixarTexto()">⬇ Arquivar .txt</button>
    <label for="arquivoTexto"><button type="button" class="btn-azul">⬆ Abrir .txt</button></label><input id="arquivoTexto" type="file" accept=".txt,text/plain" hidden onchange="abrirArquivo(this.files[0])">
</div>
<button class="botao-mostrar-controles" onclick="mostrarControles()">☰ Mostrar botões</button>

<script>
    const video = document.getElementById('camera');
    const textoEl = document.getElementById('texto');
    const statusEl = document.getElementById('status');
    const velocidadeTelaEl = document.getElementById('velocidadeTela');
    const mostrarVelocidadeEl = document.getElementById('mostrarVelocidade');

    let velocidade = 0.8;
    let rodandoTexto = false;
    let posicao = 0;
    let gravando = false;
    let mediaRecorder;
    let dadosVideo = [];

    async function alternarTelaCheia() {
        try {
            if (document.fullscreenElement || document.webkitFullscreenElement) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
            const entrar = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
            if (!entrar) throw new Error('API indisponível');
            await entrar.call(document.documentElement);
        } catch (erro) { alert('A tela cheia foi bloqueada. No Netlify, abra o site em HTTPS e clique diretamente no botão.'); }
    }
    function atualizarBotaoTelaCheia() { document.getElementById('botaoTelaCheia').textContent = document.fullscreenElement ? '⛶ Sair da Tela Cheia' : '⛶ Tela Cheia'; }
    document.addEventListener('fullscreenchange', atualizarBotaoTelaCheia);
    document.addEventListener('webkitfullscreenchange', atualizarBotaoTelaCheia);

    function alterarTamanho(valor) { textoEl.style.fontSize = valor + 'px'; document.getElementById('mostrarTamanho').textContent = valor + 'px'; }
    function baixarTexto() { const texto = document.getElementById('entradaTexto').value; if (!texto.trim()) return alert('Digite um texto antes de arquivar.'); const nome = document.getElementById('nomeTexto').value.trim() || 'meu-texto'; const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([texto], { type: 'text/plain;charset=utf-8' })); link.download = nome.replace(/[\\/:*?"<>|]/g, '-') + '.txt'; link.click(); URL.revokeObjectURL(link.href); }
    function abrirArquivo(arquivo) { if (!arquivo) return; const leitor = new FileReader(); leitor.onload = () => { document.getElementById('entradaTexto').value = leitor.result; carregarTexto(); }; leitor.readAsText(arquivo, 'UTF-8'); }
    async function atualizarListaTextos() { const lista = document.getElementById('textosSalvos'); try { (await fetch('/api/textos')).json().then(nomes => nomes.forEach(nome => lista.add(new Option(nome, nome)))); } catch (erro) {} }
    async function salvarTextoNoProjeto() { const nome = document.getElementById('nomeTexto').value.trim(); const texto = document.getElementById('entradaTexto').value; if (!nome || !texto.trim()) return alert('Informe um nome e um texto para salvar.'); try { const resposta = await fetch('/api/textos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome, texto }) }); if (!resposta.ok) throw new Error(); await atualizarListaTextos(); alert('Texto salvo na pasta textos do projeto.'); } catch (erro) { alert('Inicie o projeto com npm start para salvar dentro da pasta textos.'); } }
    async function abrirTextoDoProjeto(nome) { if (!nome) return; const resposta = await fetch('/api/textos/' + encodeURIComponent(nome)); const dados = await resposta.json(); document.getElementById('entradaTexto').value = dados.texto || ''; carregarTexto(); }

    // 🔹 Ligar câmera
    async function iniciarCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 1280, height: 720 },
                audio: true 
            });
            video.srcObject = stream;
            statusEl.textContent = "câmera ligada";
            statusEl.style.background = "#43a047";
        } catch (err) {
            alert("Erro ao ligar câmera: " + err.message);
        }
    }

    // 🔹 Carregar texto
    function carregarTexto() {
        textoEl.textContent = document.getElementById('entradaTexto').value;
        posicao = 0;
        textoEl.style.transform = `translateY(${posicao}px)`;
    }

    // 🔹 Rolar texto
    async function iniciarTexto() {
        if (!textoEl.textContent.trim()) carregarTexto();
        posicao = 0;
        textoEl.style.transform = 'translateY(0px)';
        if (!document.fullscreenElement) await alternarTelaCheia();
        rodandoTexto = true;
        document.getElementById('velocidadeFlutuante').classList.add('visivel');
    }
    function pararTexto() {
        rodandoTexto = false;
        document.getElementById('velocidadeFlutuante').classList.remove('visivel');
        document.querySelector('.controles').classList.remove('oculto');
    }
    function mostrarControles() { document.querySelector('.controles').classList.remove('oculto'); }
    function atualizarVelocidade() { const valor = velocidade.toFixed(2); velocidadeTelaEl.textContent = valor; mostrarVelocidadeEl.textContent = valor; }
    function maisRapido() { velocidade = Math.min(9.9, velocidade + 0.2); atualizarVelocidade(); }
    function maisLento() { velocidade = Math.max(0.1, velocidade - 0.2); atualizarVelocidade(); }

    // 🔹 Gravar vídeo
    function iniciarGravacao(ocultarControles = true) {
        if (!video.srcObject) return alert("Primeiro ligue a câmera!");
        if (!window.MediaRecorder) return alert("Este navegador não suporta gravação de vídeo.");
        dadosVideo = [];
        const tipoSuportado = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
            .find(tipo => MediaRecorder.isTypeSupported(tipo));
        if (!tipoSuportado) return alert("O navegador não oferece um formato de gravação compatível.");
        mediaRecorder = new MediaRecorder(video.srcObject, { mimeType: tipoSuportado });
        mediaRecorder.ondataavailable = e => dadosVideo.push(e.data);
        mediaRecorder.onstop = salvarVideo;
        mediaRecorder.start(250);
        gravando = true;
        statusEl.textContent = "GRAVANDO";
        statusEl.classList.add("gravando");
        if (ocultarControles) document.querySelector(".controles").classList.add("oculto"); // somente clique/toque real no botão GRAVAR
        iniciarTexto(); // começa a rolar o texto junto
    }

    function pararGravacao() {
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        gravando = false;
        rodandoTexto = false;
        document.querySelector('.controles').classList.remove('oculto');
        document.getElementById('velocidadeFlutuante').classList.remove('visivel');
        statusEl.textContent = "salvando...";
        statusEl.classList.remove("gravando");
    }

    function salvarVideo() {
        const blob = new Blob(dadosVideo, { type: mediaRecorder.mimeType || "video/webm" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "gravacao-" + new Date().toLocaleString('pt-BR').replace(/[\/:]/g,'-') + ".webm";
        a.click();
        statusEl.textContent = "salvo!";
        statusEl.style.background = "#43a047";
    }

    // 🔹 Animação contínua do texto
    function animar() {
        if (rodandoTexto) {
            posicao -= velocidade;
            textoEl.style.transform = `translateY(${posicao}px)`;
        }
        requestAnimationFrame(animar);
    }
    alterarTamanho(document.getElementById('tamanhoTexto').value);
    atualizarVelocidade();
    atualizarListaTextos();
    animar();

    // Conta, carteira e pagamentos Telepronto
    let tokenConta = localStorage.getItem('telepronto_token') || '';
    let usuarioConta = null;
    function alternarPainelConta(){document.getElementById('painelConta').classList.toggle('aberto');}
    async function apiConta(url, options={}) {
      const headers={...(options.headers||{}),...(tokenConta?{Authorization:'Bearer '+tokenConta}:{})};
      const r=await fetch(url,{...options,headers});
      const data=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||'Não foi possível concluir a operação.');
      return data;
    }
    async function autenticarConta(action){
      const msg=document.getElementById('mensagemConta'); msg.textContent='Aguarde...';
      try{
        const data=await apiConta('/.netlify/functions/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,email:document.getElementById('contaEmail').value,password:document.getElementById('contaSenha').value})});
        tokenConta=data.token; localStorage.setItem('telepronto_token',tokenConta); usuarioConta=data.user;
        await carregarConta(); msg.textContent='Conta conectada.';
      }catch(e){
        let message=e.message;
        try{
          const response=await fetch('/.netlify/functions/health');
          const diagnostic=await response.json();
          if(!diagnostic.configuration?.databaseConfigured) message+=' Diagnóstico: DATABASE_URL não está disponível neste deploy.';
          else if(!diagnostic.databaseConnected) message+=' Diagnóstico: não foi possível conectar ao PostgreSQL.';
          else if(!diagnostic.schemaReady) message+=' Diagnóstico: faltam tabelas no banco ('+(diagnostic.missingTables||[]).join(', ')+').';
          if(!diagnostic.configuration?.jwtConfigured) message+=' JWT_SECRET ausente ou inválida neste deploy.';
        }catch{}
        msg.textContent=message;
      }
    }
    async function carregarConta(){
      if(!tokenConta){document.getElementById('areaLogin').hidden=false;document.getElementById('areaCarteira').hidden=true;document.getElementById('saldoCreditos').textContent='Entre para ver créditos';return;}
      try{
        const data=await apiConta('/.netlify/functions/auth');
        usuarioConta=data.user;
        document.getElementById('emailContaAtiva').textContent=usuarioConta.email;
        document.getElementById('areaLogin').hidden=true;document.getElementById('areaCarteira').hidden=false;
        await atualizarSaldo();
      }catch(e){sairConta();}
    }
    async function atualizarSaldo(){
      try{const d=await apiConta('/.netlify/functions/billing');document.getElementById('saldoCreditos').textContent=d.balance+' créditos';document.getElementById('saldoDetalhe').textContent=d.balance;}
      catch(e){document.getElementById('mensagemConta').textContent=e.message;}
    }
    function atualizarPacotesTela(){
      const moeda=document.getElementById('moedaCreditos').value, sel=document.getElementById('pacoteCreditos');
      const valores=moeda==='USD'?[['us-10','10 vídeos — US$ 1.00'],['us-20','20 vídeos — US$ 2.00'],['us-100','100 vídeos — US$ 10.00'],['us-500','500 vídeos — US$ 50.00']]:[['br-10','10 vídeos — R$ 1,00'],['br-20','20 vídeos — R$ 2,00'],['br-100','100 vídeos — R$ 10,00'],['br-500','500 vídeos — R$ 50,00']];
      sel.innerHTML=''; valores.forEach(([v,t])=>sel.add(new Option(t,v)));
    }
    async function comprarCreditos(){
      try{
        const currency=document.getElementById('moedaCreditos').value;
        const d=await apiConta('/.netlify/functions/billing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packageId:document.getElementById('pacoteCreditos').value,currency})});
        location.href=d.checkoutUrl;
      }catch(e){alert(e.message);}
    }
    function sairConta(){tokenConta='';usuarioConta=null;localStorage.removeItem('telepronto_token');carregarConta();}
    async function debitarGravacao(){
      if(!tokenConta) throw new Error('Entre na sua conta antes de gravar.');
      const id=crypto.randomUUID();
      return await apiConta('/.netlify/functions/billing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'consume',recordingId:id})});
    }
    const iniciarGravacaoOriginal = iniciarGravacao;
    iniciarGravacao = async function(event){
      if(!tokenConta){alternarPainelConta();alert('Entre ou crie sua conta para usar as gravações com créditos.');return;}
      try{
        const carteira=await apiConta('/.netlify/functions/billing');
        if(Number(carteira.balance)<1){alternarPainelConta();alert('Você está sem créditos. Compre um pacote para gravar.');return;}
        iniciarGravacaoOriginal(Number(event?.detail) > 0); // eventos de teclado (Espaço/Enter) nunca ocultam os controles
      }catch(e){alert(e.message);}
    };
    const salvarVideoOriginal = salvarVideo;
    salvarVideo = async function(){
      try{
        await debitarGravacao();
        salvarVideoOriginal();
        statusEl.textContent='salvo! 1 crédito utilizado';
        await atualizarSaldo();
      }catch(e){statusEl.textContent='gravação não liberada';alert('Não foi possível confirmar o crédito. O vídeo não será disponibilizado: '+e.message);}
    };
    carregarConta();
    if(new URLSearchParams(location.search).has('payment')) setTimeout(()=>{carregarConta();alert('Estamos confirmando seu pagamento. Os créditos aparecem assim que a SumUp confirmar.');},700);


    // Gravação de tela integrada ao Telepronto (independente da página gravador-tela.html).
    let gravadorTelaCompleta = null;
    let fluxoTelaCompleta = null;
    let fluxoMicrofoneTela = null;
    let partesTelaCompleta = [];

    async function alternarGravacaoTelaCompleta() {
        if (gravadorTelaCompleta && gravadorTelaCompleta.state !== 'inactive') {
            gravadorTelaCompleta.stop();
            return;
        }

        if (!navigator.mediaDevices?.getDisplayMedia || !window.MediaRecorder) {
            alert('Seu navegador não oferece suporte à gravação de tela.');
            return;
        }

        const botao = document.getElementById('btnGravarTelaCompleta');
        try {
            // O usuário escolhe compartilhar a tela inteira na janela do navegador.
            fluxoTelaCompleta = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: 'always' },
                audio: true
            });

            const faixas = [...fluxoTelaCompleta.getTracks()];
            try {
                fluxoMicrofoneTela = await navigator.mediaDevices.getUserMedia({ audio: true });
                faixas.push(...fluxoMicrofoneTela.getAudioTracks());
            } catch (erroAudio) {
                console.warn('Microfone não disponível; gravando o áudio compartilhado, se houver.', erroAudio);
            }

            const fluxoComAudio = new MediaStream(faixas);
            const formatos = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
            const formato = formatos.find(tipo => MediaRecorder.isTypeSupported(tipo)) || '';
            gravadorTelaCompleta = new MediaRecorder(fluxoComAudio, formato ? { mimeType: formato } : undefined);
            partesTelaCompleta = [];

            gravadorTelaCompleta.ondataavailable = evento => {
                if (evento.data?.size) partesTelaCompleta.push(evento.data);
            };
            gravadorTelaCompleta.onstop = () => {
                const arquivo = new Blob(partesTelaCompleta, { type: gravadorTelaCompleta.mimeType || 'video/webm' });
                const url = URL.createObjectURL(arquivo);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'telepronto-tela-' + new Date().toISOString().replace(/[:.]/g, '-') + '.webm';
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 60000);
                [fluxoTelaCompleta, fluxoMicrofoneTela].forEach(fluxo => fluxo?.getTracks().forEach(faixa => faixa.stop()));
                fluxoTelaCompleta = null;
                fluxoMicrofoneTela = null;
                botao.textContent = '🔴 Gravar a tela inteira';
                botao.classList.remove('gravando');
                statusEl.textContent = 'Gravação da tela salva!';
                statusEl.style.background = '#43a047';
            };

            gravadorTelaCompleta.start(500);
            botao.textContent = '⏹ Parar gravação da tela';
            botao.classList.add('gravando');
            statusEl.textContent = 'GRAVANDO A TELA INTEIRA';
            statusEl.classList.add('gravando');

            fluxoTelaCompleta.getVideoTracks()[0].addEventListener('ended', () => {
                if (gravadorTelaCompleta?.state === 'recording') gravadorTelaCompleta.stop();
            }, { once: true });
        } catch (erro) {
            [fluxoTelaCompleta, fluxoMicrofoneTela].forEach(fluxo => fluxo?.getTracks().forEach(faixa => faixa.stop()));
            fluxoTelaCompleta = null;
            fluxoMicrofoneTela = null;
            botao.textContent = '🔴 Gravar a tela inteira';
            botao.classList.remove('gravando');
            alert('Não foi possível iniciar a gravação: ' + erro.message);
        }
    }

    // Abre o gravador de tela em HTML separado, sem misturar as duas funções.
    function abrirGravadorTela() {
        window.location.href = 'gravador-tela.html';
    }
</script>
