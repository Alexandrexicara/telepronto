[build]
  command = "npm install --no-audit --no-fund && npm run check && npm run build:repertorio"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/textos"
  to = "/.netlify/functions/textos"
  status = 200

[[redirects]]
  from = "/api/textos/*"
  to = "/.netlify/functions/textos/:splat"
  status = 200

[[redirects]]
  from = "/repertorio-karaoke"
  to = "/dist-repertorio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/repertorio-karaoke/*"
  to = "/dist-repertorio/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
